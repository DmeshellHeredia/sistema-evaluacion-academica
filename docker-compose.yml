services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: academia-sqlserver
    environment:
      SA_PASSWORD: "${SA_PASSWORD:-Dev@Password_2024!}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1444:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
          -P "${SA_PASSWORD:-Dev@Password_2024!}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  sqlserver_data:
    driver: local
