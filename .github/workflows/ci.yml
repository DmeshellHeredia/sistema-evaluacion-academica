name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Las pruebas E2E (Playwright) están excluidas intencionalmente de este flujo.
# Requieren una instancia real de SQL Server + un proceso de backend en ejecución,
# lo que las hace frágiles en los runners gratuitos de GitHub (tiempo de arranque
# de contenedor, disponibilidad de puertos, sincronización del seeder). Ejecútalas
# localmente; consulta el README para las instrucciones.

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

      # UnitTests + IntegrationTests con collection de coverage.
      # IntegrationTests usa Testcontainers — Docker disponible en ubuntu-latest.
      - name: Test with coverage
        run: |
          dotnet test --configuration Release --no-build --verbosity minimal \
            --collect:"XPlat Code Coverage" \
            --settings coverage.runsettings \
            --results-directory coverage-results

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"coverage-results/**/coverage.cobertura.xml" \
            -targetdir:"coverage-results/report" \
            -reporttypes:"MarkdownSummaryGithub;Html;Cobertura" \
            -assemblyfilters:"+SistemaEvaluacionAcademica.Domain;+SistemaEvaluacionAcademica.Application;+SistemaEvaluacionAcademica.Infrastructure;+SistemaEvaluacionAcademica.API"

      - name: Write coverage summary
        run: cat coverage-results/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-results/report/
          retention-days: 7

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistema-evaluacion-academica
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sistema-evaluacion-academica/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
